<script>
/* ============ 原型说明（第二版：深色色块风格） ============

const PASS_LINE = 50;
const KEY = 'tongdao_proto_b1';

const QUIZ = [
  {type:'choice', q:'你发现一位平时很照顾你的同事，在报销单里多报了 200 元。你会？',
   opts:[['装作没看见，不关我的事',1],['私下提醒他改正',4],['直接向上级反映',3],['既然没人查，我下次也多报一点',0]]},
  {type:'choice', q:'你在网上看到一条让人很气愤的消息，但没有任何来源。你会？',
   opts:[['立刻转发，让更多人知道',0],['转发并注明"不确定真假"',2],['与我无关，划走',2],['先查证，确认后再决定是否转发',4]]},
  {type:'choice', q:'你要卖掉一部二手手机，屏幕有一处买家很难发现的暗伤。你会？',
   opts:[['主动说明，并适当让价',4],['不提，对方没发现就算了',0],['对方问到再说',2],['只写"成色如图"',1]]},
  {type:'choice', q:'小组项目交付后，你发现一个关键错误是自己造成的，目前没人知道。你会？',
   opts:[['等别人发现了再说',1],['悄悄改掉，不声张',2],['主动说明并负责补救',4],['暗示可能是别人的环节出了问题',0]]},
  {type:'open', q:'"善意的谎言"违背实事求是吗？请写出你的立场和理由。'}
];

/* 模块类型：sizes 为可选尺寸（s = 半宽，w = 整行） */
const TYPES = {
  todo:   {name:'待办清单', desc:'记录要做的事',       sizes:['w'],     color:'cream', keys:['待办','任务','清单','todo','计划']},
  habit:  {name:'习惯打卡', desc:'每天点一下，累计天数', sizes:['s','w'], color:'lav',   keys:['打卡','习惯','坚持','早起','运动']},
  count:  {name:'倒计时',   desc:'距离重要日子还有几天', sizes:['s','w'], color:'lime',  keys:['倒计时','纪念日','还有几天','考试']},
  ledger: {name:'记账',     desc:'快速记一笔支出',     sizes:['s','w'], color:'peach', keys:['记账','花销','支出','账本','花了']},
  note:   {name:'随手记',   desc:'一块自由书写的便签',  sizes:['w'],     color:'sky',   keys:['笔记','便签','记录','随手记','备忘']},
  quote:  {name:'一句话',   desc:'每日一句，或写下自己的', sizes:['w','s'], color:'graphite', keys:['一句','语录','名言','座右铭']},
  hot:    {name:'社区热帖', desc:'社区里正在讨论什么',  sizes:['w'],     color:'graphite', keys:['热帖','社区','热门']}

const COLORS = {lime:['#d7f36b','#14150c'], lav:['#c9b8ff','#15121f'], peach:['#ffc9a3','#1f150e'], sky:['#a9dcff','#0d1820'],

const nextYear = new Date().getFullYear() + 1;
let seq = Date.now();
const mk = (type, o={}) => Object.assign({k:'w' + (seq++).toString(36), type, size:TYPES[type].sizes[0], color:TYPES[type].color, title:TYPES[type].name,
  d: type==='todo' ? {items:[]} : type==='count' ? {date:nextYear+'-01-01'} : type==='ledger' ? {total:0, step:10} : type==='habit' ? {n:0} : {text:''}}, o);

const QUOTES = ['知之为知之，不知为不知，是知也。','勿以恶小而为之，勿以善小而不为。','言必信，行必果。','实事求是，是一切工作的出发点。'];
const SEED_POSTS = [
  {id:2, name:'林夏', time:'12 分钟前', text:'求教：公司让我在数据报告里"优化"一下口径，实际就是把不好看的数字藏起来。大家遇到过吗，怎么处理的？', likes:41, liked:false, cmts:[{name:'老周',text:'如实写，另附一页说明口径差异，让领导自己选。'}]},
  {id:1, name:'老周', time:'1 小时前', text:'今天在菜市场多找了我 20 块，走出两条街才发现，又折回去还了。摊主愣了半天。分享一下，没别的意思。', likes:23, liked:false, cmts:[{name:'阿青',text:'这种小事最见人品。'}]},
  {id:3, name:'阿青', time:'3 小时前', text:'推荐一个核实消息来源的小习惯：转发前先搜一下原始出处，找不到就不转。', likes:17, liked:false, cmts:[]}
];

const fresh = () => ({
  stage:'welcome', phone:'', agree:false, err:'', qi:0, answers:[], blocked:[],
  score:0, dims:{a:50,b:50,c:50,d:50}, logs:[],
  tab:'home', edit:false, page:0, cfgK:null,
  pages:[
    {name:'主页', items:[mk('quote'), mk('count',{title:'元旦',size:'s'}), mk('habit',{title:'早起'}),
      mk('todo',{d:{items:[{t:'看看社区的新帖子',d:false},{t:'长按模块，试试编辑桌面',d:false}]}})]},
    {name:'工作', items:[mk('note',{title:'会议记录'}), mk('ledger',{title:'午餐'}), mk('count',{title:'项目交付',size:'s',color:'pink',d:{date:nextYear+'-03-01'}})]}

/* ---------- 模拟评估（正式版替换为大模型） ---------- */
const NEG = ['骗','刷单','造谣','假货','坑人','傻','滚','蠢','钻空子','薅','报复','伪造','代考','水军'];
const POS = ['谢谢','感谢','抱歉','对不起','来源','查证','核实','如实','帮忙','分享','承认','改正','道歉','事实'];
function scoreOpen(t){
  t = t.trim(); if (t.length < 8) return 0;
  let s = t.length >= 60 ? 3 : t.length >= 25 ? 2 : 1;
  if (/因为|所以|但是|如果|理由|我认为|不过|然而/.test(t)) s += 1;
  if (NEG.some(k => t.includes(k)) && !/不应|不能|反对|不该/.test(t)) s -= 1;
  return Math.max(0, Math.min(4, s));
}
function judge(text, source){
  const neg = NEG.filter(k => text.includes(k)), pos = POS.filter(k => text.includes(k));
  let d = 0, why = '中性内容';
  if (neg.length){ d = -Math.min(12, 6 * neg.length); why = '疑似不当倾向：' + neg.join('、'); }
  else if (pos.length){ d = Math.min(3, pos.length); why = '正向信号：' + pos.join('、'); }
  else if (text.length > 40){ d = 1; why = '认真表达'; }
  S.score = Math.max(0, Math.min(100, S.score + d));
  if (d){ const k = 'abcd'[Math.floor(Math.random()*4)]; S.dims[k] = Math.max(0, Math.min(100, S.dims[k] + d * 2)); }
  S.logs.unshift({d, source, why, text:text.slice(0,30)});
  S.logs = S.logs.slice(0, 40);
  if (S.stage === 'main' && S.score < PASS_LINE){ S.stage = 'banned'; S.sheet = null; S.blocked.push(S.phone); }
}

/* ---------- AI 对话（模拟） ---------- */
function aiReply(text){
  if (NEG.some(k => text.includes(k))) return {r:'ai', t:'这件事我帮不了，它可能会损害别人的利益。换个方向，我很乐意帮忙。'};
  const id = Object.keys(TYPES).find(k => TYPES[k].keys.some(w => text.toLowerCase().includes(w)));
  if (id) return {r:'ai', t:'明白，我为你准备了这个模块：', w:id};
  return {r:'ai', t:'我在听。可以说得再具体一点，比如"我想要一个记账的模块"。'};
}
function sendChat(text){
  text = text.trim(); if (!text) return;
  S.chat.push({r:'me', t:text}); judge(text, 'AI 对话');
  if (S.stage === 'main') S.chat.push(aiReply(text));
  render();
}

    S.err = !/^1\d{10}$/.test(S.phone) ? '请输入正确的 11 位手机号' : S.blocked.includes(S.phone) ? '该手机号已无法申请' : !S.agree ? '请先阅读并同意评估告知' : '';
    if (!S.err) { S.stage = 'quiz'; S.qi = 0; S.answers = []; }
  },
  pick: v => { S.answers[S.qi] = +v; },

    const q = QUIZ[S.qi];

    else if (S.answers[S.qi] == null) return false;

/* ---------- 桌面编辑：长按进入、拖动排序 ---------- */
let press = null, drag = null, swallowClick = false;
const onDesk = () => S.stage === 'main' && S.tab === 'home' && !S.sheet;
$app.addEventListener('pointerdown', e => {
  if (!onDesk() || e.button || drag) return;
  const w = e.target.closest('[data-wid]');
  if (!w || (S.edit && e.target.closest('[data-act]'))) return;
  if (!S.edit && e.target.closest('input,textarea')) return;
  const hold = !S.edit ? 450 : e.pointerType === 'mouse' ? 0 : 160;
  clearTimeout(press && press.t);
  press = {w, id:e.pointerId, x:e.clientX, y:e.clientY, t:setTimeout(startDrag, hold)};
});
function startDrag(){
  const p = press; press = null; if (!p || !p.w.isConnected) return;
  if (!S.edit) { S.edit = true; $app.dataset.edit = true; save(); if (navigator.vibrate) navigator.vibrate(12); }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const r = p.w.getBoundingClientRect();
  drag = {el:p.w, gx:p.x - r.left, gy:p.y - r.top, px:p.x, py:p.y, last:null, lastT:0};
  p.w.classList.add('dragging');
  requestAnimationFrame(dragFrame);
}
function dragFrame(){
  if (!drag) return;
  const {el} = drag, grid = el.parentNode, sc = document.getElementById('deskScroll'), box = sc.getBoundingClientRect();
  if (drag.py < box.top + 50) sc.scrollTop -= 9; else if (drag.py > box.bottom - 210) sc.scrollTop += 9;
  const g = grid.getBoundingClientRect();
  el.style.transform = `translate(${drag.px - drag.gx - g.left - el.offsetLeft}px,${drag.py - drag.gy - g.top - el.offsetTop}px) scale(1.04)`;
  const hit = document.elementFromPoint(drag.px, drag.py), t = hit && hit.closest('[data-wid]'), now = Date.now();
  if (t && t !== el && !(t === drag.last && now - drag.lastT < 350)) {
    const others = [...grid.children].filter(c => c !== el), before = others.map(c => c.getBoundingClientRect());
    if (el.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING) t.after(el); else t.before(el);
    others.forEach((c, i) => { const a = c.getBoundingClientRect(), dx = before[i].left - a.left, dy = before[i].top - a.top;
      if (!dx && !dy) return;
      c.style.transition = 'none'; c.style.transform = `translate(${dx}px,${dy}px)`; c.offsetWidth;
      c.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)'; c.style.transform = ''; });
    drag.last = t; drag.lastT = now;
  }
  requestAnimationFrame(dragFrame);
}
addEventListener('pointermove', e => {
  if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { clearTimeout(press.t); press = null; }
  if (drag) { drag.px = e.clientX; drag.py = e.clientY; }
});
function endDrag(){
  if (press) { clearTimeout(press.t); press = null; }
  if (!drag) return;
  const {el} = drag; drag = null;
  el.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)'; el.style.transform = '';
  setTimeout(() => { el.classList.remove('dragging'); el.style.transition = ''; }, 200);
  const order = [...el.parentNode.querySelectorAll('[data-wid]')].map(c => c.dataset.wid), p = page();
  p.items.sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k)); save();
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 60);
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e => { if (drag && e.cancelable) e.preventDefault(); }, {passive:false});
$app.addEventListener('contextmenu', e => { if (e.target.closest('[data-wid]')) e.preventDefault(); });
$app.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); return; }
  if (S.edit && onDesk() && e.target.hasAttribute('data-blank')) { S.edit = false; render(); }
}, true);

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeSheet' && !el.hasAttribute('data-force') && e.target.closest('[data-stop]')) return;
  if (A[el.dataset.act](el.dataset.v) !== false) render();
});
$app.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'phone') S.phone = t.value.trim();
  if (t.id === 'nameIn') S.name = t.value || '新同志';
  if (t.id === 'pageName') { page().name = t.value || '未命名'; const c = document.getElementById('pageChip'); if (c) c.textContent = page().name; }
  if (d.note) item(d.note).d.text = t.value;
  if (d.cfg) { const it = item(S.cfgK); if (d.cfg === 'title') it.title = t.value || TYPES[it.type].name; else it.d[d.cfg] = d.cfg === 'step' ? Math.max(1, +t.value || 10) : t.value; }
  save();
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.id === 'chatIn') sendChat(t.value);
  if (t.dataset.todo && A.addTodo(t.dataset.todo) !== false) render();
  if (t.id === 'cmtIn' && A.sendCmt(S.openCmt) !== false) render();
  if (t.id === 'pageName' || t.dataset.cfg === 'title') t.blur();
});
if (S.stage === 'judging') S.stage = 'quiz';
render();
</script>
</body>
</html>
