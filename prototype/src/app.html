/* ---------- 模拟评估（正式版替换为大模型） ---------- */
const NEG = ['骗','刷单','造谣','假货','坑人','傻','滚','蠢','钻空子','薅','报复','伪造','代考','水军'];
const POS = ['谢谢','感谢','抱歉','对不起','来源','查证','核实','如实','帮忙','分享','承认','改正','道歉','事实'];
function scoreOpen(t){
  t = t.trim(); if (t.length < 8) return 0;
  let s = t.length >= 60 ? 3 : t.length >= 25 ? 2 : 1;
  if (/因为|所以|但是|如果|理由|我认为|不过|然而/.test(t)) s += 1;
  if (NEG.some(k => t.includes(k)) && !/不应|不能|反对|不该/.test(t)) s -= 1;
  return Math.max(0, Math.min(4, s));
}
function judge(text, source){
  const neg = NEG.filter(k => text.includes(k)), pos = POS.filter(k => text.includes(k));
  let d = 0, why = '中性内容';
  if (neg.length){ d = -Math.min(12, 6 * neg.length); why = '疑似不当倾向：' + neg.join('、'); }
  else if (pos.length){ d = Math.min(3, pos.length); why = '正向信号：' + pos.join('、'); }
  else if (text.length > 40){ d = 1; why = '认真表达'; }
  S.score = Math.max(0, Math.min(100, S.score + d));
  if (d){ const k = 'abcd'[Math.floor(Math.random()*4)]; S.dims[k] = Math.max(0, Math.min(100, S.dims[k] + d * 2)); }
  S.logs.unshift({d, source, why, text:text.slice(0,30)});
  S.logs = S.logs.slice(0, 40);
  if (S.stage === 'main' && S.score < PASS_LINE){ S.stage = 'banned'; S.sheet = null; S.blocked.push(S.phone); }
}

    <div class="divide-y divide-zinc-100 rounded-3xl bg-white px-5 shadow-sm ring-1 ring-zinc-900/5">
      ${['评估说明','用户协议','隐私政策'].map(t=>`<div class="flex h-14 items-center justify-between text-[15px]"><span>${t}</span><span class="text-zinc-300">${ic('right','size-4')}</span></div>`).join('')}
      <button class="flex h-14 w-full items-center justify-between text-[15px]" data-act="sheet" data-v="demo"><span>隐藏画像<span class="ml-2 rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-medium text-amber-700">仅原型演示</span></span><span class="text-zinc-300">${ic('right','size-4')}</span></button>
      <button class="flex h-14 w-full items-center justify-between text-[15px] text-rose-600" data-act="reset"><span>重置演示数据</span><span class="text-zinc-300">${ic('right','size-4')}</span></button></div>
    </div>`,

  sheet_lib: () => sheet(`<h2 class="mb-4 text-[20px] font-bold">模块库</h2><div class="divide-y divide-zinc-100">${Object.entries(WIDGETS).map(([id,w])=>{ const on = S.layout.includes(id); return `<div class="flex items-center gap-3 py-3.5">
      <div class="flex-1"><div class="text-[15px] font-semibold">${w.name}</div><div class="text-[13px] text-zinc-500">${w.desc}</div></div>
      <button class="${PILL} ${on?'bg-zinc-100 text-zinc-400':'bg-zinc-900 text-white'}" data-act="libAdd" data-v="${id}" ${on?'disabled':''}>${on?'已添加':'添加'}</button></div>`; }).join('')}</div>`),

  sheet_post: () => sheet(`<h2 class="mb-4 text-[20px] font-bold">发帖</h2>
    <textarea id="postIn" rows="6" placeholder="说点真实的…" class="w-full resize-none rounded-2xl bg-zinc-100 p-4 text-[16px] leading-7 outline-none placeholder:text-zinc-400"></textarea>
    <button class="${BTN} mt-4" data-act="sendPost">发布</button>`),

  sheet_demo: () => sheet(`<div class="flex items-center justify-between"><h2 class="text-[20px] font-bold">隐藏画像</h2><span class="rounded-full bg-amber-400/15 px-3 py-1 text-[11px] font-medium text-amber-300">仅原型演示 · 用户不可见</span></div>
    <div class="mt-5 flex items-end justify-between"><div><div class="text-[12px] text-white/50">综合积分</div>
      <div class="text-[56px] font-bold leading-none tabular-nums tracking-tight ${S.score<PASS_LINE?'text-rose-400':'text-emerald-400'}">${S.score}</div></div>
      <div class="pb-1 text-right text-[12px] text-white/50">淘汰线 ${PASS_LINE}<br><span class="text-[15px] font-semibold text-white">${S.score>=PASS_LINE?'高出 '+(S.score-PASS_LINE):'低于 '+(PASS_LINE-S.score)} 分</span></div></div>
    <div class="relative mt-4 h-2 rounded-full bg-white/10"><div class="h-full rounded-full ${S.score<PASS_LINE?'bg-rose-400':'bg-emerald-400'}" style="width:${S.score}%"></div><div class="absolute -top-1 h-4 w-0.5 bg-white/60" style="left:${PASS_LINE}%"></div></div>
    <div class="mt-6 grid grid-cols-2 gap-3">${[['a','是非分明'],['b','不损害他人'],['c','实事求是'],['d','正直善良']].map(([k,n])=>`<div class="rounded-2xl bg-white/[.06] p-4 ring-1 ring-white/10"><div class="text-[12px] text-white/50">${n}</div><div class="mt-1 text-[22px] font-bold tabular-nums">${S.dims[k]}</div>
      <div class="mt-2 h-1 rounded-full bg-white/10"><div class="h-full rounded-full bg-white/70" style="width:${S.dims[k]}%"></div></div></div>`).join('')}</div>
    <div class="mt-6 text-[12px] font-medium text-white/50">信号记录</div>
    <div class="mt-2 divide-y divide-white/10">${S.logs.length?S.logs.map(l=>`<div class="flex gap-3 py-3"><span class="w-9 shrink-0 text-[14px] font-bold tabular-nums ${l.d>0?'text-emerald-400':l.d<0?'text-rose-400':'text-white/40'}">${l.d>0?'+':''}${l.d}</span>
      <div class="min-w-0 text-[13px] leading-5"><div><span class="text-white/50">${esc(l.source)}</span> · ${esc(l.why)}</div>${l.text?`<div class="truncate text-white/40">“${esc(l.text)}”</div>`:''}</div></div>`).join(''):'<div class="py-3 text-[13px] text-white/40">暂无</div>'}</div>
    <p class="mt-4 text-[12px] leading-5 text-white/40">试试在社区或 AI 对话里输入含"刷单""造谣""骗"的内容，观察扣分与淘汰。</p>`, true)
};

/* ---------- 桌面模块 ---------- */
const CARD = 'h-full rounded-3xl p-5';
const WT = 'text-[12px] font-semibold';
const W = {
  todo: () => { const left = S.todos.filter(t=>!t.d).length; return `<div class="${CARD} bg-white shadow-sm ring-1 ring-zinc-900/5">
    <div class="flex items-baseline justify-between"><span class="${WT} text-zinc-400">待办清单</span><span class="text-[12px] text-zinc-400">${left} 项未完成</span></div>
    <div class="mt-2">${S.todos.map((t,i)=>`<button class="flex w-full items-center gap-3 py-2 text-left" data-act="tg" data-v="${i}">
      <span class="flex size-[22px] shrink-0 items-center justify-center rounded-full ${t.d?'bg-emerald-500 text-white':'ring-[1.5px] ring-zinc-300'}">${t.d?ic('check','size-3.5'):''}</span>
      <span class="text-[15px] ${t.d?'text-zinc-400 line-through':''}">${esc(t.t)}</span></button>`).join('')}</div>
    <div class="mt-2 flex h-10 items-center gap-2 rounded-full bg-zinc-100 pl-4 pr-1"><input id="todoIn" placeholder="添加一项" class="h-full min-w-0 flex-1 bg-transparent text-[14px] outline-none placeholder:text-zinc-400">
      <button class="flex size-8 items-center justify-center rounded-full bg-zinc-900 text-white" data-act="addTodo">${ic('plus','size-4')}</button></div></div>`; },
  note: () => `<div class="${CARD} bg-amber-100"><div class="${WT} text-amber-700/70">随手记</div>
    <textarea id="noteIn" rows="3" placeholder="写点什么…" class="mt-2 w-full resize-none bg-transparent text-[15px] leading-7 text-amber-950 outline-none placeholder:text-amber-700/40">${esc(S.note)}</textarea></div>`,
  habit: () => `<div class="${CARD} flex min-h-40 flex-col bg-zinc-900 text-white"><div class="${WT} text-white/50">习惯打卡</div>
    <div class="mt-2 flex-1"><span class="text-[44px] font-bold leading-none tabular-nums tracking-tight">${S.habit}</span><span class="ml-1 text-[13px] text-white/50">天</span></div>
    <button class="h-9 rounded-full bg-white/15 text-[13px] font-semibold active:bg-white/25" data-act="habit">今日打卡</button></div>`,
  quote: () => `<div class="${CARD} flex min-h-40 flex-col bg-emerald-600 text-white"><div class="${WT} text-white/60">每日一句</div>
    <p class="mt-3 font-serif text-[17px] font-semibold leading-7">${QUOTES[new Date().getDate()%QUOTES.length]}</p></div>`,
  hot: () => `<div class="${CARD} bg-white shadow-sm ring-1 ring-zinc-900/5"><div class="${WT} text-zinc-400">社区热帖</div>
    <div class="mt-1 divide-y divide-zinc-100">${S.posts.slice().sort((a,b)=>b.likes-a.likes).slice(0,3).map((p,i)=>`<button class="flex w-full items-center gap-3 py-2.5 text-left" data-act="tab" data-v="community">
      <span class="w-4 text-[15px] font-bold tabular-nums ${i===0?'text-rose-500':'text-zinc-300'}">${i+1}</span>
      <span class="min-w-0 flex-1 truncate text-[14px]">${esc(p.text)}</span><span class="text-[12px] tabular-nums text-zinc-400">${p.likes}</span></button>`).join('')}</div></div>`,
  count: () => { const d = Math.ceil((new Date(new Date().getFullYear()+1,0,1)-new Date())/864e5); return `<div class="${CARD} flex min-h-40 flex-col bg-indigo-600 text-white"><div class="${WT} text-white/60">倒计时</div>
    <div class="mt-2 flex-1"><span class="text-[44px] font-bold leading-none tabular-nums tracking-tight">${d}</span><span class="ml-1 text-[13px] text-white/60">天</span></div><div class="text-[13px] text-white/70">距离元旦</div></div>`; },
  ledger: () => `<div class="${CARD} flex min-h-40 flex-col bg-white shadow-sm ring-1 ring-zinc-900/5"><div class="${WT} text-zinc-400">今日支出</div>
    <div class="mt-2 flex-1 text-[34px] font-bold leading-none tabular-nums tracking-tight"><span class="mr-0.5 text-[18px] text-zinc-400">¥</span>${S.ledger}</div>
    <button class="h-9 rounded-full bg-zinc-100 text-[13px] font-semibold active:bg-zinc-200" data-act="spend">记一笔 ¥10</button></div>`
};

function render(){
  $app.innerHTML = V[S.stage]() + (S.sheet ? V['sheet_'+S.sheet]() : '');
  const c = document.getElementById('chatScroll'); if (c) c.scrollTop = c.scrollHeight;
  save();
}

/* ---------- AI 对话（模拟） ---------- */
function aiReply(text){
  if (NEG.some(k => text.includes(k))) return {r:'ai', t:'这件事我帮不了，它可能会损害别人的利益。换个方向，我很乐意帮忙。'};
  const id = Object.keys(WIDGET_KEYWORDS).find(k => WIDGET_KEYWORDS[k].some(w => text.toLowerCase().includes(w)));
  if (id) return S.layout.includes(id)
    ? {r:'ai', t:`你的桌面上已经有「${WIDGETS[id].name}」了。还想加点别的吗？`}
    : {r:'ai', t:'明白，我为你准备了这个模块：', w:id};
  return {r:'ai', t:'我在听。可以说得再具体一点，比如"我想要一个记账的模块"。'};
}
function sendChat(text){
  text = text.trim(); if (!text) return;
  S.chat.push({r:'me', t:text}); judge(text, 'AI 对话');
  if (S.stage === 'main') S.chat.push(aiReply(text));
  render();
}

/* ---------- 事件 ---------- */
const val = id => (document.getElementById(id) || {value:''}).value.trim();
const A = {
  go: v => { S.stage = v; S.err = ''; },
  agree: () => { S.agree = !S.agree; S.err = ''; },
  startQuiz: () => {
    S.err = !/^1\d{10}$/.test(S.phone) ? '请输入正确的 11 位手机号' : S.blocked.includes(S.phone) ? '该手机号已无法申请' : !S.agree ? '请先阅读并同意评估告知' : '';
    if (!S.err) { S.stage = 'quiz'; S.qi = 0; S.answers = []; }
  },
  pick: v => { S.answers[S.qi] = +v; },
  next: () => {
    const q = QUIZ[S.qi];
    if (q.type === 'open') { const t = val('open'); if (t.length < 8) return false; S.answers[S.qi] = t; }
    else if (S.answers[S.qi] == null) return false;
    if (S.qi < QUIZ.length - 1) { S.qi++; return; }
    S.stage = 'judging';
    setTimeout(() => {
      const raw = QUIZ.reduce((s,q,i)=> s + (q.type==='choice' ? q.opts[S.answers[i]][1] : scoreOpen(S.answers[i])), 0);
      S.score = Math.round(raw / (QUIZ.length*4) * 100);
      S.dims = {a:S.score, b:S.score, c:S.score, d:S.score};
      S.logs = [{d:S.score, source:'注册问答', why:`初始分（原始 ${raw}/${QUIZ.length*4}）`, text:''}];
      if (S.score < PASS_LINE) { S.stage = 'rejected'; S.blocked.push(S.phone); } else { S.stage = 'main'; S.tab = 'home'; }
      render();
    }, 1600);
  },
  tab: v => { S.tab = v; S.edit = false; S.openCmt = null; },
  edit: () => { S.edit = !S.edit; },
  sheet: v => { S.sheet = v; },
  closeSheet: () => { S.sheet = null; },
  mv: v => { const [i,d] = v.split(',').map(Number), j = i + d; if (j<0||j>=S.layout.length) return false; [S.layout[i],S.layout[j]] = [S.layout[j],S.layout[i]]; },
  rm: v => { S.layout.splice(+v,1); },
  libAdd: v => { if (!S.layout.includes(v)) S.layout.push(v); },
  addW: v => { const [id,i] = v.split(','); if (!S.layout.includes(id)) S.layout.push(id); S.chat[+i].done = true; S.chat.push({r:'ai', t:'已添加到桌面，返回桌面就能看到。'}); },
  tg: v => { S.todos[+v].d = !S.todos[+v].d; },
  addTodo: () => { const t = val('todoIn'); if (!t) return false; S.todos.push({t, d:false}); },
  habit: () => { S.habit++; }, spend: () => { S.ledger += 10; },
  like: v => { const p = S.posts.find(p=>p.id==v); p.liked = !p.liked; p.likes += p.liked?1:-1; },
  cmt: v => { S.openCmt = S.openCmt==v ? null : +v; },
  sendCmt: v => { const t = val('cmtIn'); if (!t) return false; S.posts.find(p=>p.id==v).cmts.push({name:S.name, text:t}); S.openCmt = null; judge(t, '社区评论'); },
  sendPost: () => { const t = val('postIn'); if (!t) return false; S.posts.unshift({id:Date.now(), name:S.name, text:t, likes:0, liked:false, cmts:[], mine:true}); S.sheet = null; judge(t, '社区发帖'); },
  send: () => { sendChat(val('chatIn')); return false; },
  chip: v => { sendChat(v); return false; },
  reset: () => { if (!confirm('清空所有演示数据并回到注册页？')) return false; localStorage.removeItem(KEY); S = fresh(); }
};
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeSheet' && e.target.closest('[data-stop]')) return;
  if (A[el.dataset.act](el.dataset.v) !== false) render();
});
$app.addEventListener('input', e => {
  if (e.target.id === 'phone') S.phone = e.target.value.trim();
  if (e.target.id === 'noteIn') S.note = e.target.value;
  if (e.target.id === 'nameIn') S.name = e.target.value || '新同志';
  save();
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'chatIn') sendChat(e.target.value);
  if (e.target.id === 'todoIn' && A.addTodo() !== false) render();
  if (e.target.id === 'cmtIn' && A.sendCmt(S.openCmt) !== false) render();
});
if (S.stage === 'judging') S.stage = 'quiz';
if (!V['tab_'+S.tab] && S.tab !== 'ai') S.tab = 'home';
render();
</script>
</body>
</html>
