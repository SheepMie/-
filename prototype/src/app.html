/* ---------- 模拟评估（正式版替换为大模型） ---------- */
const NEG = ['骗','刷单','造谣','假货','坑人','傻','滚','蠢','钻空子','薅','报复','伪造','代考','水军'];
const POS = ['谢谢','感谢','抱歉','对不起','来源','查证','核实','如实','帮忙','分享','承认','改正','道歉','事实'];
function scoreOpen(t){
  t = t.trim(); if (t.length < 8) return 0;
  let s = t.length >= 60 ? 3 : t.length >= 25 ? 2 : 1;
  if (/因为|所以|但是|如果|理由|我认为|不过|然而/.test(t)) s += 1;
  if (NEG.some(k => t.includes(k)) && !/不应|不能|反对|不该/.test(t)) s -= 1;
  return Math.max(0, Math.min(4, s));
}
function judge(text, source){
  const neg = NEG.filter(k => text.includes(k)), pos = POS.filter(k => text.includes(k));
  let d = 0, why = '中性内容';
  if (neg.length){ d = -Math.min(12, 6 * neg.length); why = '疑似不当倾向：' + neg.join('、'); }
  else if (pos.length){ d = Math.min(3, pos.length); why = '正向信号：' + pos.join('、'); }
  else if (text.length > 40){ d = 1; why = '认真表达'; }
  S.score = Math.max(0, Math.min(100, S.score + d));
  if (d){ const k = 'abcd'[Math.floor(Math.random()*4)]; S.dims[k] = Math.max(0, Math.min(100, S.dims[k] + d * 2)); }
  S.logs.unshift({d, source, why, text:text.slice(0,30)});
  S.logs = S.logs.slice(0, 40);
  if (S.stage === 'main' && S.score < PASS_LINE){ S.stage = 'banned'; S.sheet = null; S.blocked.push(S.phone); }
}

        <div><div class="font-serif text-[17px] font-bold">${esc(p.name)}</div><div class="font-serif text-[13px] text-stone-400 oldstyle-nums">${esc(p.time||'刚刚')}</div></div></div>
      <p class="mt-4 whitespace-pre-wrap break-words text-[16px] leading-8 text-stone-800">${esc(p.text)}</p>
      <div class="mt-4 flex gap-5 font-serif text-[15px] oldstyle-nums">
        <button class="flex items-center gap-1.5 ${p.liked?'text-clay':'text-stone-400'}" data-act="like" data-v="${p.id}">${ic('heart','size-[18px]',p.liked?'currentColor':'none')}${p.likes}</button>
        <button class="flex items-center gap-1.5 text-stone-400" data-act="cmt" data-v="${p.id}">${ic('bubble','size-[18px]')}${p.cmts.length||'评论'}</button></div>
      ${p.cmts.length?`<div class="mt-5 space-y-3 border-t border-stone-200/80 pt-5">${p.cmts.map(c=>`<div class="border-l-[3px] border-stone-900 pl-3">
        <div class="font-serif text-[14px] font-bold">${esc(c.name)}</div><div class="break-words text-[14px] leading-6 text-stone-600">${esc(c.text)}</div></div>`).join('')}</div>`:''}
      ${S.openCmt===p.id?`<div class="mt-5 flex h-11 items-center gap-2 rounded-full bg-stone-200/50 pl-4 pr-1"><input id="cmtIn" placeholder="写下你的看法" class="h-full min-w-0 flex-1 bg-transparent text-[14px] outline-none placeholder:text-stone-400">
        <button class="flex size-9 items-center justify-center rounded-full bg-stone-900 text-white" data-act="sendCmt" data-v="${p.id}">${ic('up','size-4')}</button></div>`:''}
    </article>`).join('')}</div>`,

  ai: () => `<header class="flex items-center gap-2 px-5 pb-4 pt-14">
      <button class="flex size-10 items-center justify-center text-stone-500" data-act="tab" data-v="home">${ic('left','size-6')}</button>
      <div><div class="font-serif text-[22px] font-bold leading-tight">助手</div><div class="font-serif text-[13px] text-stone-500">描述你想要的功能</div></div></header>
    <div class="no-bar flex-1 space-y-3 overflow-y-auto px-5 py-2" id="chatScroll">
      ${S.chat.map((m,i)=>m.r==='me'
        ? `<div class="flex justify-end"><div class="max-w-[82%] whitespace-pre-wrap break-words rounded-[24px] rounded-br-lg bg-stone-900 px-5 py-3 text-[15px] leading-7 text-stone-50">${esc(m.t)}</div></div>`
        : `<div class="flex"><div class="paper-card max-w-[86%] whitespace-pre-wrap break-words rounded-[24px] rounded-bl-lg px-5 py-3 text-[15px] leading-7">${esc(m.t)}${m.w?`<div class="mt-3 flex items-center gap-4 border-t border-stone-200/80 pt-3"><div class="flex-1 border-l-[3px] border-stone-900 pl-3"><div class="font-serif text-[16px] font-bold leading-6">${WIDGETS[m.w].name}</div><div class="text-[12px] leading-5 text-stone-500">${WIDGETS[m.w].desc}</div></div>
            <button class="${m.done?PILL+' bg-stone-200/70 text-stone-400':PILL_DARK}" data-act="addW" data-v="${m.w},${i}" ${m.done?'disabled':''}>${m.done?'已添加':'添加'}</button></div>`:''}</div></div>`).join('')}
    </div>
    <div class="no-bar flex gap-2 overflow-x-auto px-5 py-3">${['我想要一个记账的模块','我想记点笔记','帮我加个社区热帖','加一个待办清单'].map(t=>`<button class="h-9 shrink-0 rounded-full border border-stone-300 px-4 font-serif text-[14px] text-stone-600" data-act="chip" data-v="${t}">${t}</button>`).join('')}</div>
    <div class="px-5 pb-8"><div class="paper-card flex h-14 items-center gap-2 rounded-full pl-6 pr-2">
      <input id="chatIn" placeholder="说说你想要的功能…" class="h-full min-w-0 flex-1 bg-transparent text-[15px] outline-none placeholder:text-stone-400">
      <button class="flex size-10 items-center justify-center rounded-full bg-stone-900 text-white" data-act="send">${ic('up','size-[18px]')}</button></div></div>`,

  tab_me: () => `<header class="px-7 pb-5 pt-14"><div class="font-serif text-[17px] text-stone-500">个人信息</div><h1 class="${HEAD} mt-1">我的</h1></header>
    <div class="no-bar flex-1 space-y-3.5 overflow-y-auto px-5 pb-36">
    <div class="flex items-center gap-4 rounded-[28px] bg-stone-900 p-6 text-stone-50">
      <div class="flex size-16 shrink-0 items-center justify-center rounded-full bg-white/10 font-serif text-[26px] font-bold">${esc(S.name[0])}</div>
      <div class="min-w-0 flex-1"><input id="nameIn" value="${esc(S.name)}" maxlength="12" class="w-full bg-transparent font-serif text-[22px] font-bold outline-none">
      <div class="mt-0.5 font-serif text-[14px] text-stone-400 oldstyle-nums">${esc(S.phone.slice(0,3))} **** ${esc(S.phone.slice(-4))}</div></div>
      <span class="text-stone-500">${ic('edit','size-4')}</span></div>
    <div class="paper-card flex rounded-[28px] px-6 py-5">${[[S.posts.filter(p=>p.mine).length,'帖子'],[S.layout.length,'桌面模块'],[S.habit,'打卡天数']].map(([n,l])=>`<div class="flex-1 border-l-[3px] border-stone-900 pl-3"><div class="${LABEL} text-[14px]">${l}</div><div class="${NUM} text-[28px] leading-9">${n}</div></div>`).join('')}</div>
    <div class="paper-card divide-y divide-stone-200/80 rounded-[28px] px-6 font-serif text-[17px]">
      ${['评估说明','用户协议','隐私政策'].map(t=>`<div class="flex h-14 items-center justify-between"><span>${t}</span><span class="text-stone-300">${ic('right','size-4')}</span></div>`).join('')}
      <button class="flex h-14 w-full items-center justify-between" data-act="sheet" data-v="demo"><span>隐藏画像<span class="ml-2 text-[13px] text-stone-400">仅原型演示</span></span><span class="text-stone-300">${ic('right','size-4')}</span></button>
      <button class="flex h-14 w-full items-center justify-between text-clay" data-act="reset"><span>重置演示数据</span><span class="text-stone-300">${ic('right','size-4')}</span></button></div>
    </div>`,

  sheet_lib: () => sheet(`<h2 class="mb-3 font-serif text-[26px] font-bold">模块库</h2><div class="divide-y divide-stone-200/80">${Object.entries(WIDGETS).map(([id,w])=>{ const on = S.layout.includes(id); return `<div class="flex items-center gap-3 py-4">
      <div class="flex-1"><div class="font-serif text-[17px] font-bold">${w.name}</div><div class="text-[13px] text-stone-500">${w.desc}</div></div>
      <button class="${on?PILL+' bg-stone-200/70 text-stone-400':PILL_DARK}" data-act="libAdd" data-v="${id}" ${on?'disabled':''}>${on?'已添加':'添加'}</button></div>`; }).join('')}</div>`),

  sheet_post: () => sheet(`<h2 class="mb-4 font-serif text-[26px] font-bold">发帖</h2>
    <textarea id="postIn" rows="6" placeholder="说点真实的…" class="paper-card w-full resize-none rounded-[24px] p-5 text-[16px] leading-7 outline-none placeholder:text-stone-400"></textarea>
    <button class="${BTN} mt-4" data-act="sendPost">发布</button>`),

  sheet_demo: () => sheet(`<div class="flex items-baseline justify-between"><h2 class="font-serif text-[26px] font-bold">隐藏画像</h2><span class="font-serif text-[13px] text-stone-400">仅原型演示 · 用户不可见</span></div>
    <div class="mt-6 flex items-end justify-between"><div><div class="font-serif text-[15px] text-stone-400">综合积分</div>
      <div class="${NUM} text-[72px] leading-none ${S.score<PASS_LINE?'text-clay-light':''}">${S.score}</div></div>
      <div class="pb-2 text-right font-serif text-[14px] text-stone-400 oldstyle-nums">淘汰线 ${PASS_LINE}<br><span class="text-[17px] text-stone-50">${S.score>=PASS_LINE?'高出 '+(S.score-PASS_LINE):'低于 '+(PASS_LINE-S.score)} 分</span></div></div>
    <div class="relative mt-5 h-1 rounded-full bg-white/15"><div class="h-full rounded-full ${S.score<PASS_LINE?'bg-clay-light':'bg-stone-50'}" style="width:${S.score}%"></div><div class="absolute -top-1.5 h-4 w-px bg-white/70" style="left:${PASS_LINE}%"></div></div>
    <div class="mt-8 grid grid-cols-2 gap-x-6 gap-y-5">${[['a','是非分明'],['b','不损害他人'],['c','实事求是'],['d','正直善良']].map(([k,n])=>`<div class="flex items-center justify-between border-l-[3px] border-stone-50 pl-3"><span class="font-serif text-[15px] text-stone-300">${n}</span><span class="${NUM} text-[24px]">${S.dims[k]}</span></div>`).join('')}</div>
    <div class="mt-8 font-serif text-[15px] text-stone-400">信号记录</div>
    <div class="mt-1 divide-y divide-white/10">${S.logs.length?S.logs.map(l=>`<div class="flex gap-3 py-3"><span class="${NUM} w-10 shrink-0 text-[18px] ${l.d>0?'':l.d<0?'text-clay-light':'text-stone-500'}">${l.d>0?'+':''}${l.d}</span>
      <div class="min-w-0 text-[13px] leading-5"><div><span class="text-stone-400">${esc(l.source)}</span> · ${esc(l.why)}</div>${l.text?`<div class="truncate text-stone-500">“${esc(l.text)}”</div>`:''}</div></div>`).join(''):'<div class="py-3 text-[13px] text-stone-500">暂无</div>'}</div>
    <p class="mt-4 text-[12px] leading-5 text-stone-500">试试在社区或助手对话里输入含"刷单""造谣""骗"的内容，观察扣分与淘汰。</p>`, true)
};

/* ---------- 桌面模块 ---------- */
const CARD = 'paper-card h-full rounded-[28px] p-6';
const W = {
  quote: () => `<div class="h-full rounded-[28px] bg-stone-900 p-6 text-stone-50">
    <p class="text-[18px] leading-8 tracking-wide">${QUOTES[new Date().getDate()%QUOTES.length]}</p>
    <div class="mt-2 font-serif text-[14px] text-stone-400">今日一句</div></div>`,
  count: () => { const now = new Date(), y = now.getFullYear(), d = Math.ceil((new Date(y+1,0,1)-now)/864e5), passed = Math.round((1 - d/365)*100);
    return `<div class="${CARD} flex items-center justify-between"><div><div class="${LABEL}">倒计时</div>
      <div class="${NUM} mt-1 text-[46px] leading-none">${d}<span class="ml-2 text-[22px] font-normal">天</span></div>
      <div class="mt-2 font-serif text-[15px] text-stone-500 oldstyle-nums">距离 ${y+1} 年元旦</div></div>${ring(passed, passed+'<span class="text-[11px] text-stone-400">%</span>', 'size-[72px]')}</div>`; },
  habit: () => `<div class="${CARD} flex min-h-44 flex-col"><div class="${LABEL}">习惯打卡</div>
    <div class="${NUM} mt-1 text-[38px] leading-none">${S.habit}<span class="ml-1.5 text-[17px] font-normal text-stone-500">天</span></div>
    <div class="mt-3 flex flex-1 items-end gap-1.5">${[0,1,2,3,4,5,6].map(i=>`<div class="flex-1 rounded-[5px] ${i >= 7-Math.min(7,S.habit)?'h-8 bg-stone-500':'h-2 bg-stone-300'}"></div>`).join('')}</div>
    <button class="mt-3 h-9 rounded-full bg-stone-900 font-serif text-[14px] text-stone-50 active:opacity-80" data-act="habit">今日打卡</button></div>`,
  ledger: () => `<div class="${CARD} flex min-h-44 flex-col"><div class="${LABEL}">今日支出</div>
    <div class="${NUM} mt-1 flex-1 text-[38px] leading-none"><span class="mr-1 text-[20px] font-normal text-stone-500">¥</span>${S.ledger}</div>
    <button class="mt-3 h-9 rounded-full border border-stone-300 font-serif text-[14px] text-stone-700 active:bg-stone-200/60" data-act="spend">记一笔 ¥10</button></div>`,
  todo: () => { const left = S.todos.filter(t=>!t.d).length; return `<div class="${CARD}">
    <div class="flex items-center justify-between"><div><div class="font-serif text-[22px] font-bold">待办清单</div><div class="${LABEL} oldstyle-nums">${left ? left+' 项未完成' : '全部完成'}</div></div>
      ${ring(S.todos.length ? (S.todos.length-left)/S.todos.length*100 : 0, left, 'size-14')}</div>
    <div class="mt-3 border-t border-stone-200/80 pt-2">${S.todos.map((t,i)=>`<button class="flex w-full items-center gap-3 py-2 text-left" data-act="tg" data-v="${i}">
      <span class="flex size-[22px] shrink-0 items-center justify-center rounded-full ${t.d?'bg-stone-900 text-white':'border-[1.5px] border-stone-400'}">${t.d?ic('check','size-3.5'):''}</span>
      <span class="text-[16px] ${t.d?'text-stone-400 line-through':''}">${esc(t.t)}</span></button>`).join('')}</div>
    <div class="mt-2 flex h-11 items-center gap-2 rounded-full bg-stone-200/50 pl-5 pr-1"><input id="todoIn" placeholder="添加一项" class="h-full min-w-0 flex-1 bg-transparent text-[15px] outline-none placeholder:text-stone-400">
      <button class="flex size-9 items-center justify-center rounded-full bg-stone-900 text-white" data-act="addTodo">${ic('plus','size-4')}</button></div></div>`; },
  hot: () => `<div class="${CARD}"><div class="${LABEL}">社区热帖</div>
    <div class="mt-1 divide-y divide-stone-200/80">${S.posts.slice().sort((a,b)=>b.likes-a.likes).slice(0,3).map((p,i)=>`<button class="flex w-full items-center gap-3 py-3 text-left" data-act="tab" data-v="community">
      <span class="${NUM} w-4 text-[20px] ${i===0?'':'text-stone-300'}">${i+1}</span>
      <span class="min-w-0 flex-1 truncate text-[15px]">${esc(p.text)}</span><span class="font-serif text-[15px] text-stone-400 oldstyle-nums">${p.likes}</span></button>`).join('')}</div></div>`,
  note: () => `<div class="${CARD}"><div class="${LABEL}">随手记</div>
    <textarea id="noteIn" rows="3" placeholder="写点什么…" class="mt-2 w-full resize-none bg-transparent text-[16px] leading-8 outline-none placeholder:text-stone-400">${esc(S.note)}</textarea></div>`
};

function render(){
  $app.innerHTML = V[S.stage]() + (S.sheet ? V['sheet_'+S.sheet]() : '');
  const c = document.getElementById('chatScroll'); if (c) c.scrollTop = c.scrollHeight;
  save();
}

/* ---------- AI 对话（模拟） ---------- */
function aiReply(text){
  if (NEG.some(k => text.includes(k))) return {r:'ai', t:'这件事我帮不了，它可能会损害别人的利益。换个方向，我很乐意帮忙。'};
  const id = Object.keys(WIDGET_KEYWORDS).find(k => WIDGET_KEYWORDS[k].some(w => text.toLowerCase().includes(w)));
  if (id) return S.layout.includes(id)
    ? {r:'ai', t:`你的桌面上已经有「${WIDGETS[id].name}」了。还想加点别的吗？`}
    : {r:'ai', t:'明白，我为你准备了这个模块：', w:id};
  return {r:'ai', t:'我在听。可以说得再具体一点，比如"我想要一个记账的模块"。'};
}
function sendChat(text){
  text = text.trim(); if (!text) return;
  S.chat.push({r:'me', t:text}); judge(text, 'AI 对话');
  if (S.stage === 'main') S.chat.push(aiReply(text));
  render();
}

/* ---------- 事件 ---------- */
const val = id => (document.getElementById(id) || {value:''}).value.trim();
const A = {
  go: v => { S.stage = v; S.err = ''; },
  agree: () => { S.agree = !S.agree; S.err = ''; },
  startQuiz: () => {
    S.err = !/^1\d{10}$/.test(S.phone) ? '请输入正确的 11 位手机号' : S.blocked.includes(S.phone) ? '该手机号已无法申请' : !S.agree ? '请先阅读并同意评估告知' : '';
    if (!S.err) { S.stage = 'quiz'; S.qi = 0; S.answers = []; }
  },
  pick: v => { S.answers[S.qi] = +v; },
  next: () => {
    const q = QUIZ[S.qi];
    if (q.type === 'open') { const t = val('open'); if (t.length < 8) return false; S.answers[S.qi] = t; }
    else if (S.answers[S.qi] == null) return false;
    if (S.qi < QUIZ.length - 1) { S.qi++; return; }
    S.stage = 'judging';
    setTimeout(() => {
      const raw = QUIZ.reduce((s,q,i)=> s + (q.type==='choice' ? q.opts[S.answers[i]][1] : scoreOpen(S.answers[i])), 0);
      S.score = Math.round(raw / (QUIZ.length*4) * 100);
      S.dims = {a:S.score, b:S.score, c:S.score, d:S.score};
      S.logs = [{d:S.score, source:'注册问答', why:`初始分（原始 ${raw}/${QUIZ.length*4}）`, text:''}];
      if (S.score < PASS_LINE) { S.stage = 'rejected'; S.blocked.push(S.phone); } else { S.stage = 'main'; S.tab = 'home'; }
      render();
    }, 1600);
  },
  tab: v => { S.tab = v; S.edit = false; S.openCmt = null; },
  edit: () => { S.edit = !S.edit; },
  sheet: v => { S.sheet = v; },
  closeSheet: () => { S.sheet = null; },
  mv: v => { const [i,d] = v.split(',').map(Number), j = i + d; if (j<0||j>=S.layout.length) return false; [S.layout[i],S.layout[j]] = [S.layout[j],S.layout[i]]; },
  rm: v => { S.layout.splice(+v,1); },
  libAdd: v => { if (!S.layout.includes(v)) S.layout.push(v); },
  addW: v => { const [id,i] = v.split(','); if (!S.layout.includes(id)) S.layout.push(id); S.chat[+i].done = true; S.chat.push({r:'ai', t:'已添加到桌面，返回桌面就能看到。'}); },
  tg: v => { S.todos[+v].d = !S.todos[+v].d; },
  addTodo: () => { const t = val('todoIn'); if (!t) return false; S.todos.push({t, d:false}); },
  habit: () => { S.habit++; }, spend: () => { S.ledger += 10; },
  like: v => { const p = S.posts.find(p=>p.id==v); p.liked = !p.liked; p.likes += p.liked?1:-1; },
  cmt: v => { S.openCmt = S.openCmt==v ? null : +v; },
  sendCmt: v => { const t = val('cmtIn'); if (!t) return false; S.posts.find(p=>p.id==v).cmts.push({name:S.name, text:t}); S.openCmt = null; judge(t, '社区评论'); },
  sendPost: () => { const t = val('postIn'); if (!t) return false; S.posts.unshift({id:Date.now(), name:S.name, text:t, likes:0, liked:false, cmts:[], mine:true}); S.sheet = null; judge(t, '社区发帖'); },
  send: () => { sendChat(val('chatIn')); return false; },
  chip: v => { sendChat(v); return false; },
  reset: () => { if (!confirm('清空所有演示数据并回到注册页？')) return false; localStorage.removeItem(KEY); S = fresh(); }
};
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeSheet' && e.target.closest('[data-stop]')) return;
  if (A[el.dataset.act](el.dataset.v) !== false) render();
});
$app.addEventListener('input', e => {
  if (e.target.id === 'phone') S.phone = e.target.value.trim();
  if (e.target.id === 'noteIn') S.note = e.target.value;
  if (e.target.id === 'nameIn') S.name = e.target.value || '新同志';
  save();
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'chatIn') sendChat(e.target.value);
  if (e.target.id === 'todoIn' && A.addTodo() !== false) render();
  if (e.target.id === 'cmtIn' && A.sendCmt(S.openCmt) !== false) render();
});
if (S.stage === 'judging') S.stage = 'quiz';
if (!V['tab_'+S.tab] && S.tab !== 'ai') S.tab = 'home';
render();
</script>
</body>
</html>
