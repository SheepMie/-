/* ---------- 模拟评估（正式版替换为大模型） ---------- */
const NEG = ['骗','刷单','造谣','假货','坑人','傻','滚','蠢','钻空子','薅','报复','伪造','代考','水军'];
const POS = ['谢谢','感谢','抱歉','对不起','来源','查证','核实','如实','帮忙','分享','承认','改正','道歉','事实'];
function scoreOpen(t){
  t = t.trim(); if (t.length < 8) return 0;
  let s = t.length >= 60 ? 3 : t.length >= 25 ? 2 : 1;
  if (/因为|所以|但是|如果|理由|我认为|不过|然而/.test(t)) s += 1;
  if (NEG.some(k => t.includes(k)) && !/不应|不能|反对|不该/.test(t)) s -= 1;
  return Math.max(0, Math.min(4, s));
}
function judge(text, source){
  const neg = NEG.filter(k => text.includes(k)), pos = POS.filter(k => text.includes(k));
  let d = 0, why = '中性内容';
  if (neg.length){ d = -Math.min(12, 6 * neg.length); why = '疑似不当倾向：' + neg.join('、'); }
  else if (pos.length){ d = Math.min(3, pos.length); why = '正向信号：' + pos.join('、'); }
  else if (text.length > 40){ d = 1; why = '认真表达'; }
  S.score = Math.max(0, Math.min(100, S.score + d));
  if (d){ const k = 'abcd'[Math.floor(Math.random()*4)]; S.dims[k] = Math.max(0, Math.min(100, S.dims[k] + d * 2)); }
  S.logs.unshift({d, source, why, text:text.slice(0,30)});
  S.logs = S.logs.slice(0, 40);
  if (S.stage === 'main' && S.score < PASS_LINE){ S.stage = 'banned'; S.sheet = null; S.blocked.push(S.phone); }
}

    </article>`).join('')}</div>`,

  ai: () => `<header class="top top--back"><button type="button" class="icon-btn" data-act="tab" data-v="home" aria-label="返回桌面">${ic('left')}</button>
      <div><h1>助手</h1><p class="sub">描述你想要的功能，添加到「${esc(page().name)}」页。</p></div></header>
    <div class="screen" id="chatScroll"><div class="chat">
      ${S.chat.map((m,i)=>m.r==='me' ? `<div class="msg msg--me paper-ink">${esc(m.t)}</div>`
        : `<div class="msg msg--ai paper-cotton">${esc(m.t)}${m.w?`<div class="offer"><div class="grow"><h2 class="item">${TYPES[m.w].name}</h2><p class="note">${TYPES[m.w].desc}</p></div>
            <button type="button" class="btn btn--s ${m.done?'':'btn--primary'}" data-act="addW" data-v="${m.w},${i}" ${m.done?'disabled':''}>${m.done?'已添加':'添加'}</button></div>`:''}</div>`).join('')}
    </div></div>
    <div style="padding-inline:var(--space-lg)"><div class="row-scroll">${['我想要一个记账的模块','加一个考试倒计时','帮我加个习惯打卡','我想记点笔记'].map(t=>`<button type="button" class="btn btn--s" data-act="chip" data-v="${t}">${t}</button>`).join('')}</div></div>
    <div class="composer"><div class="field"><label class="visually-hidden" for="chatIn">给助手的话</label><input id="chatIn" name="message" autocomplete="off" placeholder="说说你想要的功能"></div>
      <button type="button" class="btn btn--primary" style="min-height:48px" data-act="send">发送</button></div>`,

  tab_me: () => `<header class="top"><h1>我的</h1></header>
    <div class="screen screen--foot">
    <div class="sheet row" style="gap:var(--space-md)">${badge(S.name,'badge--l')}
      <div class="grow" style="min-width:0"><label class="visually-hidden" for="nameIn">昵称</label><input id="nameIn" name="nickname" autocomplete="nickname" class="name-input" value="${esc(S.name)}" maxlength="12">
      <p class="sub num">${esc(S.phone.slice(0,3))} **** ${esc(S.phone.slice(-4))}</p></div></div>
    <div class="trio">${[[S.posts.filter(p=>p.mine).length,'帖子','cotton'],[S.pages.length,'桌面页','cotton'],[S.pages.reduce((n,p)=>n+p.items.length,0),'模块','cotton']].map(([n,l,c])=>`<div class="sheet ${paper(c)}"><div class="fig fig--s">${n}</div><p class="sub">${l}</p></div>`).join('')}</div>
    <div class="sheet menu ruled" style="padding-block:0">
      ${['评估说明','用户协议','隐私政策'].map(t=>`<div><span>${t}</span>${ic('right')}</div>`).join('')}
      <button type="button" data-act="sheet" data-v="demo"><span>隐藏画像（仅原型演示）</span>${ic('right')}</button>
      <button type="button" class="danger" data-act="reset"><span>重置演示数据</span>${ic('right')}</button></div>
    </div>`,

  sheet_cfg: () => { const it = item(S.cfgK); if (!it) return ''; const T = TYPES[it.type];
    return sheet(`<h2>模块设置</h2><p class="sub">${T.name}</p>
    <div class="stack" style="margin-top:var(--space-md)">
    <div><label class="lab" for="cfgTitle">名称</label><input id="cfgTitle" name="title" autocomplete="off" data-cfg="title" value="${esc(it.title)}" maxlength="10" class="input"></div>
    ${it.type==='count'?`<div><label class="lab" for="cfgDate">目标日期</label><input id="cfgDate" name="date" type="date" data-cfg="date" value="${esc(it.d.date)}" class="input"></div>`:''}
    ${it.type==='ledger'?`<div><label class="lab" for="cfgStep">每次记账金额（元）</label><input id="cfgStep" name="step" type="number" inputmode="numeric" min="1" data-cfg="step" value="${+it.d.step||10}" class="input"></div>`:''}
    ${it.type==='quote'?`<div><label class="lab" for="cfgText">自定义内容（留空则每日更换）</label><textarea id="cfgText" name="text" data-cfg="text" rows="3" placeholder="写下你的座右铭" class="input">${esc(it.d.text||'')}</textarea></div>`:''}
    <div><span class="lab">卡片</span><div class="row">${Object.entries(COLORS).map(([c,n])=>`<button type="button" class="swatch ${paper(c)}" aria-pressed="${it.color===c}" data-act="setColor" data-v="${c}" aria-label="${n}">${it.color===c?ic('check'):''}</button>`).join('')}</div></div>
    ${T.sizes.length>1?`<div><span class="lab">尺寸</span><div class="seg">${[['s','半宽'],['w','整行']].map(([v,n])=>`<button type="button" aria-pressed="${it.size===v}" data-act="setSize" data-v="${v}">${n}</button>`).join('')}</div></div>`:''}
    </div>
    <div class="pair"><button type="button" class="btn" data-act="wDel" data-v="${it.k}">删除模块</button>
      <button type="button" class="btn btn--primary" data-act="closeSheet" data-force>完成</button></div>`); },

  sheet_post: () => sheet(`<h2>发帖</h2>
    <label class="visually-hidden" for="postIn">帖子内容</label><textarea id="postIn" name="post" rows="6" placeholder="说点真实的" class="input" style="margin-block:var(--space-md)"></textarea>
    <button type="button" class="btn btn--primary btn--wide" data-act="sendPost">发布</button>`),

  sheet_demo: () => sheet(`<h2>隐藏画像</h2><p class="sub">仅原型演示，真实用户看不到这一页。</p>
    <div class="split" style="margin-top:var(--space-md);align-items:flex-end"><div class="fig fig--xl ${S.score<PASS_LINE?'neg':''}">${S.score}</div>
      <p class="sub" style="padding-bottom:var(--space-xs)">综合积分，淘汰线 ${PASS_LINE} 分。<br>${S.score>=PASS_LINE?'高出 '+(S.score-PASS_LINE):'低于 '+(PASS_LINE-S.score)} 分。</p></div>
    <table class="table" style="margin-top:var(--space-md)"><tbody>${[['a','是非分明'],['b','不损害他人'],['c','实事求是'],['d','正直善良']].map(([k,n])=>`<tr><th scope="row">${n}</th><td class="num">${S.dims[k]}</td></tr>`).join('')}</tbody></table>
    <h3 style="margin-top:var(--space-lg)">信号记录</h3>
    <table class="table" style="margin-top:var(--space-xs)"><tbody>${S.logs.length?S.logs.map(l=>`<tr><td class="delta ${l.d<0?'neg':''}">${l.d>0?'+':''}${l.d}</td>
      <td><b>${esc(l.source)}</b>　${esc(l.why)}${l.text?`<div class="quiet">“${esc(l.text)}”</div>`:''}</td></tr>`).join(''):'<tr><td>暂无</td></tr>'}</tbody></table>
    <p class="note" style="margin-top:var(--space-sm)">试试在社区或助手对话里输入含"刷单""造谣""骗"的内容，观察扣分与淘汰。</p>`)
};

/* ---------- 桌面模块（it = 模块实例） ---------- */
const WT = it => `<div class="wt">${esc(it.title)}</div>`;
const W = {
  quote: it => `${WT(it)}<p class="quote">${esc(it.d.text || QUOTES[new Date().getDate()%QUOTES.length])}</p>`,
  count: it => { const t = new Date(it.d.date + 'T00:00:00'), d = Math.ceil((t - new Date())/864e5), ok = !isNaN(d);
    return `${WT(it)}<div class="grow" style="margin-top:var(--space-xs)"><span class="fig">${ok?Math.abs(d):'?'}</span><span class="unit">天</span></div>
      <p class="note num">${ok?(d<0?'已过，':'距 ')+esc(it.d.date.replace(/-/g,'.')):'请在设置里填写日期'}</p>`; },
  habit: it => `${WT(it)}<div class="${it.size==='w'?'split':'col grow'}"><div class="grow" style="margin-top:var(--space-xs)"><span class="fig">${it.d.n}</span><span class="unit">天</span>
      <div class="week" aria-hidden="true">${[0,1,2,3,4,5,6].map(i=>`<i data-on="${i < Math.min(7,it.d.n)}"></i>`).join('')}</div></div>
    ${it.d.last===today() ? '<span class="pressed" style="align-self:center;margin-block:var(--space-xs)">今日已打卡</span>' : `<button type="button" class="btn btn--s" data-act="habit" data-v="${it.k}">打卡</button>`}</div>`,
  ledger: it => `${WT(it)}<div class="${it.size==='w'?'split':'col grow'}"><div class="grow" style="margin-top:var(--space-xs)"><span class="unit" style="margin:0 var(--space-2xs) 0 0">¥</span><span class="fig">${it.d.total}</span></div>
    <button type="button" class="btn btn--s num" data-act="spend" data-v="${it.k}">记 ¥${+it.d.step||10}</button></div>`,
  todo: it => { const left = it.d.items.filter(t=>!t.d).length; return `<div class="row" style="justify-content:space-between">${WT(it)}<span class="note num">${left ? '还剩 '+left+' 项' : it.d.items.length ? '' : '空'}</span>${!left && it.d.items.length ? '<span class="pressed">全部完成</span>' : ''}</div>
    <div class="ruled" style="margin-top:var(--space-2xs)">${it.d.items.map((t,i)=>`<button type="button" class="line" style="padding-block:0" data-done="${t.d}" role="checkbox" aria-checked="${t.d}" data-act="tg" data-v="${it.k},${i}">
      <span class="box" data-on="${t.d}">${t.d?ic('check'):''}</span><span>${esc(t.t)}</span></button>`).join('')}</div>
    <div class="well" style="margin-top:var(--space-xs)"><input data-todo="${it.k}" name="todo" autocomplete="off" aria-label="添加一项待办" placeholder="添加一项">
      <button type="button" class="icon-btn" data-act="addTodo" data-v="${it.k}" aria-label="添加">${ic('plus')}</button></div>`; },
  note: it => `${WT(it)}<textarea data-note="${it.k}" name="note" aria-label="${esc(it.title)}" rows="3" placeholder="写点什么">${esc(it.d.text||'')}</textarea>`,
  hot: it => `${WT(it)}<div class="ruled" style="margin-top:var(--space-2xs)">${S.posts.slice().sort((a,b)=>b.likes-a.likes).slice(0,3).map((p,i)=>`<button type="button" class="line" style="padding-block:0" data-act="tab" data-v="community">
      <span class="rank">${i+1}</span><span class="txt">${esc(p.text)}</span><span class="note num">${p.likes} 赞</span></button>`).join('')}</div>`
};

function render(){
  const top = (document.getElementById('deskScroll') || {}).scrollTop || 0;
  if (S.page >= S.pages.length) S.page = 0;
  $app.dataset.edit = S.edit && S.stage === 'main' && S.tab === 'home';
  $app.innerHTML = V[S.stage]() + (S.sheet ? V['sheet_'+S.sheet]() : '');
  animSheet = false;
  const desk = document.getElementById('deskScroll'); if (desk) desk.scrollTop = top;
  const c = document.getElementById('chatScroll'); if (c) c.scrollTop = c.scrollHeight;
  save();
}

/* ---------- AI 对话（模拟） ---------- */
function aiReply(text){
  if (NEG.some(k => text.includes(k))) return {r:'ai', t:'这件事我帮不了，它可能会损害别人的利益。换个方向，我很乐意帮忙。'};
  const id = Object.keys(TYPES).find(k => TYPES[k].keys.some(w => text.toLowerCase().includes(w)));
  if (id) return {r:'ai', t:'明白，我为你准备了这个模块：', w:id};
  return {r:'ai', t:'我在听。可以说得再具体一点，比如"我想要一个记账的模块"。'};
}
function sendChat(text){
  text = text.trim(); if (!text) return;
  S.chat.push({r:'me', t:text}); judge(text, 'AI 对话');
  if (S.stage === 'main') S.chat.push(aiReply(text));
  render();
}

/* ---------- 事件 ---------- */
const val = id => (document.getElementById(id) || {value:''}).value.trim();
const toBottom = () => requestAnimationFrame(() => { const d = document.getElementById('deskScroll'); if (d) d.scrollTo({top:d.scrollHeight, behavior:'smooth'}); });
const A = {
  go: v => { S.stage = v; S.err = ''; },
  agree: () => { S.agree = !S.agree; S.err = ''; },
  startQuiz: () => {
    S.err = !/^1\d{10}$/.test(S.phone) ? '请输入正确的 11 位手机号' : S.blocked.includes(S.phone) ? '该手机号已无法申请' : !S.agree ? '请先阅读并同意评估告知' : '';
    if (!S.err) { S.stage = 'quiz'; S.qi = 0; S.answers = []; }
  },
  pick: v => { S.answers[S.qi] = +v; },
  next: () => {
    const q = QUIZ[S.qi];
    if (q.type === 'open') { const t = val('open'); if (t.length < 8) return false; S.answers[S.qi] = t; }
    else if (S.answers[S.qi] == null) return false;
    if (S.qi < QUIZ.length - 1) { S.qi++; return; }
    S.stage = 'judging';
    setTimeout(() => {
      const raw = QUIZ.reduce((s,q,i)=> s + (q.type==='choice' ? q.opts[S.answers[i]][1] : scoreOpen(S.answers[i])), 0);
      S.score = Math.round(raw / (QUIZ.length*4) * 100);
      S.dims = {a:S.score, b:S.score, c:S.score, d:S.score};
      S.logs = [{d:S.score, source:'注册问答', why:`初始分（原始 ${raw}/${QUIZ.length*4}）`, text:''}];
      if (S.score < PASS_LINE) { S.stage = 'rejected'; S.blocked.push(S.phone); } else { S.stage = 'main'; S.tab = 'home'; }
      render();
    }, 1600);
  },
  tab: v => { S.tab = v; S.edit = false; S.openCmt = null; },
  edit: () => { S.edit = !S.edit; },
  sheet: v => { S.sheet = v; animSheet = true; },
  closeSheet: () => { S.sheet = null; S.cfgK = null; },
  /* 桌面：页面 */
  page: v => { S.page = +v; },
  addPage: () => { S.pages.push({name:'新页面', items:[]}); S.page = S.pages.length - 1; S.edit = true; },
  delPage: () => { if (S.pages.length < 2 || !confirm(`删除页面「${page().name}」及其中的模块？`)) return false; S.pages.splice(S.page, 1); S.page = Math.max(0, S.page - 1); },
  /* 桌面：模块 */
  add: v => { page().items.push(mk(v)); toBottom(); },
  wDel: v => { for (const p of S.pages) p.items = p.items.filter(i => i.k !== v); S.sheet = null; S.cfgK = null; },
  wSize: v => { const it = item(v), s = TYPES[it.type].sizes; it.size = s[(s.indexOf(it.size) + 1) % s.length]; },
  wColor: v => { const it = item(v), c = Object.keys(COLORS); it.color = c[(c.indexOf(it.color) + 1) % c.length]; },
  wCfg: v => { S.cfgK = v; S.sheet = 'cfg'; animSheet = true; },
  setColor: v => { item(S.cfgK).color = v; },
  setSize: v => { item(S.cfgK).size = v; },
  addW: v => { const [t,i] = v.split(','); page().items.push(mk(t)); S.chat[+i].done = true; S.chat.push({r:'ai', t:`已添加到「${page().name}」页，返回桌面就能看到。长按它可以改名称、颜色和大小。`}); },
  tg: v => { const [k,i] = v.split(','), t = item(k).d.items[+i]; t.d = !t.d; },
  addTodo: v => { const el = $app.querySelector(`[data-todo="${v}"]`), t = el ? el.value.trim() : ''; if (!t) return false; item(v).d.items.push({t, d:false}); },
  habit: v => { const it = item(v); if (it.d.last === today()) return false; it.d.n++; it.d.last = today(); }, spend: v => { const it = item(v); it.d.total += +it.d.step || 10; },
  like: v => { const p = S.posts.find(p=>p.id==v); p.liked = !p.liked; p.likes += p.liked?1:-1; },
  cmt: v => { S.openCmt = S.openCmt==v ? null : +v; },
  sendCmt: v => { const t = val('cmtIn'); if (!t) return false; S.posts.find(p=>p.id==v).cmts.push({name:S.name, text:t}); S.openCmt = null; judge(t, '社区评论'); },
  sendPost: () => { const t = val('postIn'); if (!t) return false; S.posts.unshift({id:Date.now(), name:S.name, text:t, likes:0, liked:false, cmts:[], mine:true}); S.sheet = null; judge(t, '社区发帖'); },
  send: () => { sendChat(val('chatIn')); return false; },
  chip: v => { sendChat(v); return false; },
  reset: () => { if (!confirm('清空所有演示数据并回到注册页？')) return false; localStorage.removeItem(KEY); S = fresh(); }
};

/* ---------- 桌面编辑：长按进入、拖动排序 ---------- */
let press = null, drag = null, swallowClick = false;
const onDesk = () => S.stage === 'main' && S.tab === 'home' && !S.sheet;
$app.addEventListener('pointerdown', e => {
  if (!onDesk() || e.button || drag) return;
  const w = e.target.closest('[data-wid]');
  if (!w || (S.edit && e.target.closest('[data-act]'))) return;
  if (!S.edit && e.target.closest('input,textarea')) return;
  const hold = !S.edit ? 450 : e.pointerType === 'mouse' ? 0 : 160;
  clearTimeout(press && press.t);
  press = {w, id:e.pointerId, x:e.clientX, y:e.clientY, t:setTimeout(startDrag, hold)};
});
function startDrag(){
  const p = press; press = null; if (!p || !p.w.isConnected) return;
  if (!S.edit) { S.edit = true; $app.dataset.edit = true; save(); if (navigator.vibrate) navigator.vibrate(12); }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const r = p.w.getBoundingClientRect();
  drag = {el:p.w, gx:p.x - r.left, gy:p.y - r.top, px:p.x, py:p.y, last:null, lastT:0};
  p.w.classList.add('dragging');
  requestAnimationFrame(dragFrame);
}
function dragFrame(){
  if (!drag) return;
  const {el} = drag, grid = el.parentNode, sc = document.getElementById('deskScroll'), box = sc.getBoundingClientRect();
  if (drag.py < box.top + 50) sc.scrollTop -= 9; else if (drag.py > box.bottom - 210) sc.scrollTop += 9;
  const g = grid.getBoundingClientRect();
  el.style.transform = `translate(${drag.px - drag.gx - g.left - el.offsetLeft}px,${drag.py - drag.gy - g.top - el.offsetTop}px) scale(1.04)`;
  const hit = document.elementFromPoint(drag.px, drag.py), t = hit && hit.closest('[data-wid]'), now = Date.now();
  if (t && t !== el && !(t === drag.last && now - drag.lastT < 350)) {
    const others = [...grid.children].filter(c => c !== el), before = others.map(c => c.getBoundingClientRect());
    if (el.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING) t.after(el); else t.before(el);
    others.forEach((c, i) => { const a = c.getBoundingClientRect(), dx = before[i].left - a.left, dy = before[i].top - a.top;
      if (!dx && !dy) return;
      c.style.transition = 'none'; c.style.transform = `translate(${dx}px,${dy}px)`; c.offsetWidth;
      c.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)'; c.style.transform = ''; });
    drag.last = t; drag.lastT = now;
  }
  requestAnimationFrame(dragFrame);
}
addEventListener('pointermove', e => {
  if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { clearTimeout(press.t); press = null; }
  if (drag) { drag.px = e.clientX; drag.py = e.clientY; }
});
function endDrag(){
  if (press) { clearTimeout(press.t); press = null; }
  if (!drag) return;
  const {el} = drag; drag = null;
  el.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)'; el.style.transform = '';
  setTimeout(() => { el.classList.remove('dragging'); el.style.transition = ''; }, 200);
  const order = [...el.parentNode.querySelectorAll('[data-wid]')].map(c => c.dataset.wid), p = page();
  p.items.sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k)); save();
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 60);
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e => { if (drag && e.cancelable) e.preventDefault(); }, {passive:false});
$app.addEventListener('contextmenu', e => { if (e.target.closest('[data-wid]')) e.preventDefault(); });
$app.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); return; }
  if (S.edit && onDesk() && e.target.hasAttribute('data-blank')) { S.edit = false; render(); }
}, true);

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeSheet' && !el.hasAttribute('data-force') && e.target.closest('[data-stop]')) return;
  if (A[el.dataset.act](el.dataset.v) !== false) render();
});
$app.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'phone') S.phone = t.value.trim();
  if (t.id === 'nameIn') S.name = t.value || '新同志';
  if (t.id === 'pageName') { page().name = t.value || '未命名'; const c = document.getElementById('pageChip'); if (c) c.textContent = page().name; }
  if (d.note) item(d.note).d.text = t.value;
  if (d.cfg) { const it = item(S.cfgK); if (d.cfg === 'title') it.title = t.value || TYPES[it.type].name; else it.d[d.cfg] = d.cfg === 'step' ? Math.max(1, +t.value || 10) : t.value; }
  save();
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.id === 'chatIn') sendChat(t.value);
  if (t.dataset.todo && A.addTodo(t.dataset.todo) !== false) render();
  if (t.id === 'cmtIn' && A.sendCmt(S.openCmt) !== false) render();
  if (t.id === 'pageName' || t.dataset.cfg === 'title') t.blur();
});
if (S.stage === 'judging') S.stage = 'quiz';
render();
</script>
</body>
</html>
