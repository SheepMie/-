/* ---------- 模拟评估（正式版替换为大模型） ---------- */
const NEG = ['骗','刷单','造谣','假货','坑人','傻','滚','蠢','钻空子','薅','报复','伪造','代考','水军'];
const POS = ['谢谢','感谢','抱歉','对不起','来源','查证','核实','如实','帮忙','分享','承认','改正','道歉','事实'];
function scoreOpen(t){
  t = t.trim(); if (t.length < 8) return 0;
  let s = t.length >= 60 ? 3 : t.length >= 25 ? 2 : 1;
  if (/因为|所以|但是|如果|理由|我认为|不过|然而/.test(t)) s += 1;
  if (NEG.some(k => t.includes(k)) && !/不应|不能|反对|不该/.test(t)) s -= 1;
  return Math.max(0, Math.min(4, s));
}
function judge(text, source){
  const neg = NEG.filter(k => text.includes(k)), pos = POS.filter(k => text.includes(k));
  let d = 0, why = '中性内容';
  if (neg.length){ d = -Math.min(12, 6 * neg.length); why = '疑似不当倾向：' + neg.join('、'); }
  else if (pos.length){ d = Math.min(3, pos.length); why = '正向信号：' + pos.join('、'); }
  else if (text.length > 40){ d = 1; why = '认真表达'; }
  S.score = Math.max(0, Math.min(100, S.score + d));
  if (d){ const k = 'abcd'[Math.floor(Math.random()*4)]; S.dims[k] = Math.max(0, Math.min(100, S.dims[k] + d * 2)); }
  S.logs.unshift({d, source, why, text:text.slice(0,30)});
  S.logs = S.logs.slice(0, 40);
  if (S.stage === 'main' && S.score < PASS_LINE){ S.stage = 'banned'; S.sheet = null; S.blocked.push(S.phone); }
}

/* ---------- AI 对话（模拟） ---------- */
function aiReply(text){
  if (NEG.some(k => text.includes(k))) return {r:'ai', t:'这件事我帮不了，它可能会损害别人的利益。换个方向，我很乐意帮忙。'};
  const id = Object.keys(WIDGET_KEYWORDS).find(k => WIDGET_KEYWORDS[k].some(w => text.toLowerCase().includes(w)));
  if (id) return S.layout.includes(id)
    ? {r:'ai', t:`你的桌面上已经有「${WIDGETS[id].name}」了。还想加点别的吗？`}
    : {r:'ai', t:'明白，我为你准备了这个模块：', w:id};
  return {r:'ai', t:'我在听。可以说得再具体一点，比如"我想要一个记账的模块"。'};
}
function sendChat(text){
  text = text.trim(); if (!text) return;
  S.chat.push({r:'me', t:text}); judge(text, 'AI 对话');
  if (S.stage === 'main') S.chat.push(aiReply(text));
  render();
}

/* ---------- 事件 ---------- */
const val = id => (document.getElementById(id) || {value:''}).value.trim();
const A = {
  go: v => { S.stage = v; S.err = ''; },
  agree: () => { S.agree = !S.agree; S.err = ''; },
  startQuiz: () => {
    S.err = !/^1\d{10}$/.test(S.phone) ? '请输入正确的 11 位手机号' : S.blocked.includes(S.phone) ? '该手机号已无法申请' : !S.agree ? '请先阅读并同意评估告知' : '';
    if (!S.err) { S.stage = 'quiz'; S.qi = 0; S.answers = []; }
  },
  pick: v => { S.answers[S.qi] = +v; },
  next: () => {
    const q = QUIZ[S.qi];
    if (q.type === 'open') { const t = val('open'); if (t.length < 8) return false; S.answers[S.qi] = t; }
    else if (S.answers[S.qi] == null) return false;
    if (S.qi < QUIZ.length - 1) { S.qi++; return; }
    S.stage = 'judging';
    setTimeout(() => {
      const raw = QUIZ.reduce((s,q,i)=> s + (q.type==='choice' ? q.opts[S.answers[i]][1] : scoreOpen(S.answers[i])), 0);
      S.score = Math.round(raw / (QUIZ.length*4) * 100);
      S.dims = {a:S.score, b:S.score, c:S.score, d:S.score};
      S.logs = [{d:S.score, source:'注册问答', why:`初始分（原始 ${raw}/${QUIZ.length*4}）`, text:''}];
      if (S.score < PASS_LINE) { S.stage = 'rejected'; S.blocked.push(S.phone); } else { S.stage = 'main'; S.tab = 'home'; }
      render();
    }, 1600);
  },
  tab: v => { S.tab = v; S.edit = false; S.openCmt = null; },
  edit: () => { S.edit = !S.edit; },
  sheet: v => { S.sheet = v; },
  closeSheet: () => { S.sheet = null; },
  mv: v => { const [i,d] = v.split(',').map(Number), j = i + d; if (j<0||j>=S.layout.length) return false; [S.layout[i],S.layout[j]] = [S.layout[j],S.layout[i]]; },
  rm: v => { S.layout.splice(+v,1); },
  libAdd: v => { if (!S.layout.includes(v)) S.layout.push(v); },
  addW: v => { const [id,i] = v.split(','); if (!S.layout.includes(id)) S.layout.push(id); S.chat[+i].done = true; S.chat.push({r:'ai', t:'已添加到桌面，返回桌面就能看到。'}); },
  tg: v => { S.todos[+v].d = !S.todos[+v].d; },
  addTodo: () => { const t = val('todoIn'); if (!t) return false; S.todos.push({t, d:false}); },
  habit: () => { S.habit++; }, spend: () => { S.ledger += 10; },
  like: v => { const p = S.posts.find(p=>p.id==v); p.liked = !p.liked; p.likes += p.liked?1:-1; },
  cmt: v => { S.openCmt = S.openCmt==v ? null : +v; },
  sendCmt: v => { const t = val('cmtIn'); if (!t) return false; S.posts.find(p=>p.id==v).cmts.push({name:S.name, text:t}); S.openCmt = null; judge(t, '社区评论'); },
  sendPost: () => { const t = val('postIn'); if (!t) return false; S.posts.unshift({id:Date.now(), name:S.name, text:t, likes:0, liked:false, cmts:[], mine:true}); S.sheet = null; judge(t, '社区发帖'); },
  send: () => { sendChat(val('chatIn')); return false; },
  chip: v => { sendChat(v); return false; },
  reset: () => { if (!confirm('清空所有演示数据并回到注册页？')) return false; localStorage.removeItem(KEY); S = fresh(); }
};
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeSheet' && e.target.closest('[data-stop]')) return;
  if (A[el.dataset.act](el.dataset.v) !== false) render();
});
$app.addEventListener('input', e => {
  if (e.target.id === 'phone') S.phone = e.target.value.trim();
  if (e.target.id === 'noteIn') S.note = e.target.value;
  if (e.target.id === 'nameIn') S.name = e.target.value || '新同志';
  save();
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'chatIn') sendChat(e.target.value);
  if (e.target.id === 'todoIn' && A.addTodo() !== false) render();
  if (e.target.id === 'cmtIn' && A.sendCmt(S.openCmt) !== false) render();
});
if (S.stage === 'judging') S.stage = 'quiz';
if (!V['tab_'+S.tab] && S.tab !== 'ai') S.tab = 'home';
render();
</script>
